name: Deploy to DEV on push to main

on:
    workflow_dispatch:

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev

    env:
      DELTA_DIR: changed-sources

    steps:

      # ========================================
      # 1️⃣ Checkout
      # ========================================
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # ========================================
      # 2️⃣ Install CLI + Plugin
      # ========================================
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          echo y | sfdx plugins:install sfdx-git-delta
          sfdx plugins

      # ========================================
      # 3️⃣ Authenticate (JWT)
      # ========================================
      - name: Authenticate to DEV
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --instance-url ${{ vars.INSTANCE_URL }} \
            --set-default

      # ========================================
      # 4️⃣ Generate Delta
      # ========================================
      - name: Generate Delta Package
        run: |
          mkdir $DELTA_DIR

          sfdx sgd:source:delta \
            --to "HEAD" \
            --from "HEAD~1" \
            --output "$DELTA_DIR" \
            --generate-delta \
            --source force-app

          echo "Delta generation completed."

      # ========================================
      # 5️⃣ Detect Apex Changes
      # ========================================
      - name: Detect Apex Changes
        id: apexcheck
        run: |
          COUNT=$(find $DELTA_DIR -name "*.cls" | wc -l)
          echo "apexCount=$COUNT" >> $GITHUB_OUTPUT
          echo "Apex files changed: $COUNT"

      # ========================================
      # 6️⃣ Validate First (Dry Run)
      # ========================================
      - name: Validate Deployment
        id: validate
        run: |

          if [ "${{ steps.apexcheck.outputs.apexCount }}" -gt 0 ]; then
            TEST_FLAG="--test-level RunLocalTests"
          else
            TEST_FLAG="--test-level NoTestRun"
          fi

          if [ -f $DELTA_DIR/destructiveChanges/destructiveChanges.xml ]; then
            sf project deploy start \
              --manifest $DELTA_DIR/package/package.xml \
              --pre-destructive-changes $DELTA_DIR/destructiveChanges/destructiveChanges.xml \
              --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} \
              $TEST_FLAG \
              --dry-run \
              --json > validate-result.json
          else
            sf project deploy start \
              --manifest $DELTA_DIR/package/package.xml \
              --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} \
              $TEST_FLAG \
              --dry-run \
              --json > validate-result.json
          fi

      # ========================================
      # 7️⃣ Deploy After Validation
      # ========================================
      - name: Deploy Metadata
        run: |

          if [ "${{ steps.apexcheck.outputs.apexCount }}" -gt 0 ]; then
            TEST_FLAG="--test-level RunLocalTests"
          else
            TEST_FLAG="--test-level NoTestRun"
          fi

          if [ -f $DELTA_DIR/destructiveChanges/destructiveChanges.xml ]; then
            sf project deploy start \
              --manifest $DELTA_DIR/package/package.xml \
              --pre-destructive-changes $DELTA_DIR/destructiveChanges/destructiveChanges.xml \
              --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} \
              $TEST_FLAG \
              --json > deploy-result.json
          else
            sf project deploy start \
              --manifest $DELTA_DIR/package/package.xml \
              --target-org ${{ secrets.DEPLOYMENT_USER_NAME }} \
              $TEST_FLAG \
              --json > deploy-result.json
          fi

      # ========================================
      # 8️⃣ Display Test Classes Executed
      # ========================================
      - name: Display Test Classes Executed
        if: steps.apexcheck.outputs.apexCount > 0
        run: |
          echo "=============================="
          echo "Test Classes Executed:"
          echo "=============================="

          jq -r '.result.details.runTestResult.tests[].name' deploy-result.json | sort | uniq

      # ========================================
      # 9️⃣ Display Test Methods Executed
      # ========================================
      - name: Display Test Methods Executed
        if: steps.apexcheck.outputs.apexCount > 0
        run: |
          echo "=============================="
          echo "Test Methods:"
          echo "=============================="

          jq -r '.result.details.runTestResult.tests[] | "\(.name) -> \(.methodName)"' deploy-result.json

      # ========================================
      # 🔟 Display Coverage Per Class
      # ========================================
      - name: Display Coverage Per Apex Class
        if: steps.apexcheck.outputs.apexCount > 0
        run: |
          echo "=============================="
          echo "Coverage Per Apex Class:"
          echo "=============================="

          jq -r '
            .result.details.runTestResult.codeCoverage[] |
            "\(.name): \((.numLocationsCovered / .numLocations * 100 | floor))%"
          ' deploy-result.json

      # ========================================
      # 1️⃣1️⃣ Display Org-Wide Coverage
      # ========================================
      - name: Display Org-Wide Coverage
        if: steps.apexcheck.outputs.apexCount > 0
        run: |
          COVERAGE=$(jq '.result.details.runTestResult.summary.orgWideCoverage' deploy-result.json)
          echo "================================="
          echo "Salesforce Org-Wide Coverage: $COVERAGE %"
          echo "================================="

      # ========================================
      # 1️⃣2️⃣ Enforce 80% Coverage
      # ========================================
      - name: Enforce Minimum 80% Coverage
        if: steps.apexcheck.outputs.apexCount > 0
        run: |
          COVERAGE=$(jq '.result.details.runTestResult.summary.orgWideCoverage' deploy-result.json)

          if [ "$COVERAGE" -lt 80 ]; then
            echo "❌ Coverage below 80%. Failing pipeline."
            exit 1
          else
            echo "✅ Coverage requirement met."
          fi

      # ========================================
      # 1️⃣3️⃣ Deploy Post-Destructive (If Exists)
      # ========================================
      - name: Deploy Post-Destructive Changes
        if: success() && hashFiles('changed-sources/destructiveChangesPost.xml') != ''
        run: |
          sf project deploy start \
            --post-destructive-changes $DELTA_DIR/destructiveChangesPost.xml \
            --manifest $DELTA_DIR/package/package.xml \
            --target-org ${{ secrets.DEPLOYMENT_USER_NAME }}