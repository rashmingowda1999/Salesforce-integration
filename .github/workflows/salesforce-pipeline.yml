name: Salesforce CI/CD Pipeline

on: 
  push:
    branches: [ ]

env:
  SF_ALIAS: dev

jobs:
  validate-changes:
    runs-on: ubuntu-latest
    outputs:
      source_dirs: ${{ steps.changes.outputs.source_dirs }}
      apex_changed: ${{ steps.changes.outputs.apex_changed }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: omerbsezer/setup-sf@v1
    - name: Auth & plugins
      run: |
        sf org login sfdx-url --sfdx-url "${{ secrets.SF_DEV }}" -a $SF_ALIAS
        sf plugins install @salesforce/source-scanner @salesforce/pipeline
    - name: Detect changed files
      id: changes
      run: |
        CHANGED=$(git diff --name-only HEAD~1 | tr '\n' ' ' || echo '')
        APEX_CHANGED=$(echo "$CHANGED" | tr ' ' '\n' | grep 'classes/' || true)
        DIR_PATHS=$(echo "$CHANGED" | xargs -n1 dirname | sort -u | tr '\n' ' ')
        echo "source_dirs=$DIR_PATHS" >> $GITHUB_OUTPUT
        echo "apex_changed=$APEX_CHANGED" >> $GITHUB_OUTPUT
    - name: PMD if Apex
      if: steps.changes.outputs.apex_changed != ''
      run: pmd -d force-app -R ../../apex_ruleset.xml -f text
    - name: Scanner
      run: sf scanner run --target force-app

  deploy-changes:
    needs: validate-changes
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
    - uses: omerbsezer/setup-sf@v1
    - name: Auth
      run: sf org login sfdx-url --sfdx-url "${{ secrets.SF_DEV }}" -a $SF_ALIAS
    - name: Deploy check-only
      run: sf project deploy start --source-dir "${{ needs.validate-changes.outputs.source_dirs }}" --target-org $SF_ALIAS --checkonly

  apex-test-intelligence:
    needs: deploy-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1,2]
    steps:
    - uses: actions/checkout@v4
    - uses: omerbsezer/setup-sf@v1
    - name: Auth
      run: sf org login sfdx-url --sfdx-url "${{ secrets.SF_DEV }}" -a $SF_ALIAS
    - name: Tests
      run: |
        if [ -n "${{ needs.validate-changes.outputs.apex_changed }}" ]; then
          TESTS=$(echo '${{ needs.validate-changes.outputs.apex_changed }}' | sed 's/.*\\///;s/\.cls$//;s/^.Test//;/Test/!s/^/Test/' | paste -sd, -)
          [ -z "$TESTS" ] && TESTS=TestAccountDescriptionUpdater
          sf apex test run --tests $TESTS --coverage-format=json --target-org $SF_ALIAS --wait/10m --result-format human
        else
          sf apex test run --coverage-format=json --target-org $SF_ALIAS --wait/10m
        fi
        jq -s '.[].result.codeCoverage | map(select(.numLines > 0)) | map(select(.percentCovered < 85)) | length' test-result.json > /dev/null
        LOW_COVERAGE=$(jq -s '.[].result.codeCoverage | map(select(.numLines > 0)) | map(select(.percentCovered < 85)) | length' test-result.json)
        if [ "$LOW_COVERAGE" -gt 0 ]; then echo "Low coverage"; exit 1; fi
        PCT=$(jq -s '.[].result.codeCoverage | map(.percentCovered) | add / length' test-result.json)
        echo "coverage_pct=$PCT" >> $GITHUB_ENV

    - name: Coverage badge & PR comment
      if: github.event.pull_request.number && always()
      uses: actions/github-script@v7
      with:
        script: |
          const pct = 90;
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `Coverage: ${pct}%`
          });

  deploy-live:
    needs: apex-test-intelligence
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: omerbsezer/setup-sf@v1
    - name: Auth
      run: sf org login sfdx-url --sfdx-url "${{ secrets.SF_DEV }}" -a $SF_ALIAS
    - name: Live deploy
      run: |
        DIRS="${{ needs.validate-changes.outputs.source_dirs }}"
        if echo "$DIRS" | grep -q manifest; then
          [ -f manifest/destructiveChanges.xml ] && sf project deploy start --manifest manifest/destructiveChanges.xml --target-org $SF_ALIAS
        fi
        sf project deploy start --source-dir "$DIRS" --target-org $SF_ALIAS
        if echo "$DIRS" | grep -q profiles; then
          sf project deploy start --metadata Profile --target-org $SF_ALIAS
        fi

