name: salesforce-ci-cd

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target_org:
        description: "Alias/username to deploy to (overrides default alias)"
        required: false
      test_level:
        description: "RunLocalTests | RunSpecifiedTests | NoTestRun"
        required: false
        default: "RunLocalTests"

env:
  NODE_VERSION: 18
  PACKAGE_DIR: force-app
  DELTA_DIR: delta
  TARGET_ORG_ALIAS: target
  MIN_APEX_COVERAGE: 85

concurrency:
  group: salesforce-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
      SF_USERNAME: ${{ secrets.SF_USERNAME }}
      SF_CONSUMER_KEY: ${{ secrets.SF_CONSUMER_KEY }}
      SF_JWT_KEY: ${{ secrets.SF_JWT_KEY }}
      TEST_LEVEL: ${{ github.event.inputs.test_level || 'RunLocalTests' }}
      DEPLOY_ALIAS: ${{ github.event.inputs.target_org || env.TARGET_ORG_ALIAS }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install NPM deps
        run: npm ci

      - name: Install Salesforce CLI + plugins
        run: |
          npm install --global @salesforce/cli
          sf plugins install sfdx-git-delta @salesforce/plugin-apex @salesforce/plugin-packaging
          sf --version
          sf plugins

      - name: Prepare JWT key
        run: |
          mkdir -p ./.keys
          echo "$SF_JWT_KEY" | base64 -d > ./.keys/server.key
          chmod 600 ./.keys/server.key

      - name: Authenticate org (JWT)
        run: |
          sf org login jwt \
            --username "$SF_USERNAME" \
            --client-id "$SF_CONSUMER_KEY" \
            --jwt-key-file ./.keys/server.key \
            --instance-url "${SF_INSTANCE_URL:-https://login.salesforce.com}" \
            --alias "$DEPLOY_ALIAS"
          sf org display --target-org "$DEPLOY_ALIAS"

      - name: Determine diff range
        id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FROM_REF="${{ github.event.pull_request.base.sha }}"
          else
            FROM_REF="$(git rev-parse HEAD^)"
          fi
          echo "from=$FROM_REF" >> "$GITHUB_OUTPUT"
          echo "to=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Generate delta (package + destructive)
        run: |
          rm -rf "$DELTA_DIR"
          sf sgd:source:delta \
            --from "${{ steps.diff.outputs.from }}" \
            --to "${{ steps.diff.outputs.to }}" \
            --source "$PACKAGE_DIR" \
            --output "$DELTA_DIR" \
            --generate-delta
          ls -la "$DELTA_DIR"

      - name: Pull related Profile/PermSet FLS into delta
        run: |
          ./scripts/deploy/collect-permissions.sh "$PACKAGE_DIR" "$DELTA_DIR"

      - name: Skip if no deployable changes
        run: |
          if [ ! -s "$DELTA_DIR/package.xml" ]; then
            echo "No changes detected; nothing to deploy."; exit 0; fi

      - name: Deploy metadata (handles pre/post destructives)
        run: |
          DEPLOY_CMD=(sf project deploy start --manifest "$DELTA_DIR/package.xml" --target-org "$DEPLOY_ALIAS" --wait 120 --test-level "$TEST_LEVEL")
          if [ -f "$DELTA_DIR/destructiveChangesPre.xml" ]; then
            DEPLOY_CMD+=(--pre-destructive-changes "$DELTA_DIR/destructiveChangesPre.xml")
          fi
          if [ -f "$DELTA_DIR/destructiveChangesPost.xml" ]; then
            DEPLOY_CMD+=(--post-destructive-changes "$DELTA_DIR/destructiveChangesPost.xml")
          fi
          "${DEPLOY_CMD[@]}" --json > deploy-result.json
          cat deploy-result.json | jq '.result.status'

      - name: Detect Apex changes
        id: apex_changed
        run: |
          if git diff --name-only "${{ steps.diff.outputs.from }}" "${{ steps.diff.outputs.to }}" | grep -E '\\.(cls|trigger|apex)$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Apex tests & coverage gate (if Apex changed)
        if: steps.apex_changed.outputs.changed == 'true'
        run: |
          mkdir -p test-results
          sf apex test run \
            --target-org "$DEPLOY_ALIAS" \
            --result-format json \
            --code-coverage \
            --wait 60 \
            --test-level RunLocalTests \
            --output-dir test-results > apex-test-result.json
          bash scripts/deploy/check-apex-coverage.sh apex-test-result.json "$MIN_APEX_COVERAGE"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salesforce-results
          path: |
            deploy-result.json
            test-results
            delta/package.xml
            delta/destructiveChanges*.xml
