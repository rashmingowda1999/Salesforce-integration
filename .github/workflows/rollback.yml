name: 🔄 Rollback Deployment

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: 'Backup artifact name (e.g., salesforce-backup-abc123...)'
        required: true
        type: string
      target_org:
        description: 'Target Salesforce Org'
        required: true
        type: choice
        options:
          - targetOrg
          - production
          - staging
        default: 'targetOrg'
      reason:
        description: 'Reason for rollback'
        required: true
        type: string
      skip_tests:
        description: 'Skip test execution?'
        required: false
        type: boolean
        default: true

jobs:
  rollback:
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Display rollback details
        run: |
          echo "==========================================="
          echo "🔄 ROLLBACK DEPLOYMENT"
          echo "==========================================="
          echo "📦 Artifact: ${{ github.event.inputs.artifact_name }}"
          echo "🎯 Target: ${{ github.event.inputs.target_org }}"
          echo "📝 Reason: ${{ github.event.inputs.reason }}"
          echo "👤 Requested by: ${{ github.actor }}"
          echo "⏰ Timestamp: $(date)"
          echo "==========================================="

      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --instance-url ${{ vars.INSTANCE_URL }} \
            --alias ${{ github.event.inputs.target_org }}

      - name: 📥 Download backup artifact
        uses: dawidd6/action-download-artifact@v3
        with:
          name: ${{ github.event.inputs.artifact_name }}
          path: ./backup-restore
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: salesforce_deploy_21_mar.yml
          workflow_conclusion: success

      - name: 🔍 Verify backup contents
        run: |
          if [ ! -d "./backup-restore" ] || [ -z "$(ls -A ./backup-restore)" ]; then
            echo "❌ ERROR: Backup artifact is empty or not found!"
            echo "📂 Artifact name: ${{ github.event.inputs.artifact_name }}"
            exit 1
          fi

          echo "✅ Backup artifact downloaded successfully!"
          echo ""
          echo "📋 Backup contents:"
          find ./backup-restore -type f | head -20
          echo ""
          echo "📊 Total files: $(find ./backup-restore -type f | wc -l)"

      - name: 🔄 Restore from backup
        id: restore
        run: |
          echo "🚀 Starting rollback deployment..."

          TEST_LEVEL="NoTestRun"
          if [ "${{ github.event.inputs.skip_tests }}" = "false" ]; then
            TEST_LEVEL="RunLocalTests"
          fi

          sf project deploy start \
            --target-org ${{ github.event.inputs.target_org }} \
            --source-dir "./backup-restore" \
            --test-level $TEST_LEVEL \
            --json > rollback-result.json

          cat rollback-result.json

          # Extract deployment ID
          DEPLOY_ID=$(jq -r '.result.id // "Unknown"' rollback-result.json)
          echo "deployment_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

      - name: ✅ Verify rollback success
        run: |
          STATUS=$(jq -r '.status' rollback-result.json)

          if [ "$STATUS" != "0" ]; then
            echo "❌ ROLLBACK FAILED!"
            echo ""
            echo "Error details:"
            jq -r '.message // "Unknown error"' rollback-result.json
            exit 1
          fi

          echo "✅ ROLLBACK COMPLETED SUCCESSFULLY!"
          echo ""
          echo "📊 Deployment Summary:"
          jq -r '.result | "   • Components: \(.numberComponentsDeployed // 0) restored"' rollback-result.json
          jq -r '.result | "   • Status: \(.status // "Unknown")"' rollback-result.json

      - name: 📝 Create audit log
        run: |
          AUDIT_DIR="rollbacks"
          AUDIT_FILE="$AUDIT_DIR/rollback-$(date +%Y%m%d-%H%M%S).log"
          mkdir -p "$AUDIT_DIR"

          cat > "$AUDIT_FILE" << 'AUDIT_EOF'
          =====================================
          ROLLBACK AUDIT LOG
          =====================================
          Date: $(date)
          Performer: ${{ github.actor }}
          Target Org: ${{ github.event.inputs.target_org }}
          Backup Artifact: ${{ github.event.inputs.artifact_name }}
          Reason: ${{ github.event.inputs.reason }}
          Deployment ID: ${{ steps.restore.outputs.deployment_id }}
          Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          DEPLOYMENT RESULT:
          AUDIT_EOF

          jq '.' rollback-result.json >> "$AUDIT_FILE"

          echo "" >> "$AUDIT_FILE"
          echo "=====================================" >> "$AUDIT_FILE"

          echo "📝 Audit log created: $AUDIT_FILE"

          # Commit audit log to repository
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add "$AUDIT_FILE"
          git commit -m "Add rollback audit log - $(date +%Y-%m-%d)"
          git push

      - name: 📢 Notify success
        if: success()
        run: |
          echo "✅ Rollback completed successfully!"
          echo "📋 Deployment ID: ${{ steps.restore.outputs.deployment_id }}"

          # Send Slack notification if configured
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{
                \"text\": \"✅ Rollback Successful\",
                \"blocks\": [
                  {
                    \"type\": \"header\",
                    \"text\": {
                      \"type\": \"plain_text\",
                      \"text\": \"✅ Rollback Completed\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"fields\": [
                      {\"type\": \"mrkdwn\", \"text\": \"*Org:*\\n${{ github.event.inputs.target_org }}\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*By:*\\n${{ github.actor }}\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Artifact:*\\n${{ github.event.inputs.artifact_name }}\"},
                      {\"type\": \"mrkdwn\", \"text\": \"*Deployment ID:*\\n${{ steps.restore.outputs.deployment_id }}\"}
                    ]
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"*Reason:*\\n${{ github.event.inputs.reason }}\"
                    }
                  }
                ]
              }" \
              ${{ secrets.SLACK_WEBHOOK_URL }}
          fi

      - name: 🚨 Notify failure
        if: failure()
        run: |
          echo "❌ Rollback failed!"

          # Send Slack notification if configured
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "{
                \"text\": \"❌ Rollback Failed\",
                \"blocks\": [
                  {
                    \"type\": \"header\",
                    \"text\": {
                      \"type\": \"plain_text\",
                      \"text\": \"❌ Rollback Failed\"
                    }
                  },
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \"Rollback to *${{ github.event.inputs.target_org }}* failed!\\n\\n*By:* ${{ github.actor }}\\n*Artifact:* ${{ github.event.inputs.artifact_name }}\\n\\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Logs>\"
                    }
                  }
                ]
              }" \
              ${{ secrets.SLACK_WEBHOOK_URL }}
          fi

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f server.key
          rm -f rollback-result.json
