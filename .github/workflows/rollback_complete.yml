name: Complete Rollback (Git + Salesforce)

on:
  workflow_dispatch:
    inputs:
      commit_to_revert:
        description: 'Commit SHA to revert (e.g., a7a5752)'
        required: true
        type: string
      backup_directory:
        description: 'Backup directory (e.g., backups/20260419-143000)'
        required: true
        type: string
      target_org:
        description: 'Target Salesforce Org'
        required: true
        type: choice
        options:
          - targetOrg
          - production
          - staging
        default: 'targetOrg'
      reason:
        description: 'Reason for rollback'
        required: true
        type: string
      skip_tests:
        description: 'Skip test execution in Salesforce?'
        required: false
        type: boolean
        default: true
      create_rollback_branch:
        description: 'Create separate rollback branch instead of reverting main?'
        required: false
        type: boolean
        default: false

env:
  TARGET_ORG_ALIAS: targetOrg

jobs:
  complete-rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 📋 Display rollback plan
        run: |
          echo "==========================================="
          echo "🔄 COMPLETE ROLLBACK (GIT + SALESFORCE)"
          echo "==========================================="
          echo "📝 Commit to Revert: ${{ github.event.inputs.commit_to_revert }}"
          echo "📦 Backup Directory: ${{ github.event.inputs.backup_directory }}"
          echo "🎯 Target Org: ${{ github.event.inputs.target_org }}"
          echo "📝 Reason: ${{ github.event.inputs.reason }}"
          echo "👤 Requested by: ${{ github.actor }}"
          echo "⏰ Timestamp: $(date)"
          echo "🔀 Create Branch: ${{ github.event.inputs.create_rollback_branch }}"
          echo "==========================================="
          echo ""
          echo "⚠️  WARNING: This will:"
          echo "   1. Revert Git commit(s)"
          echo "   2. Restore Salesforce org from backup"
          echo "   3. Create audit trail"
          echo "==========================================="

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Full history for git operations

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      # ============================================
      # STEP 1: GIT ROLLBACK
      # ============================================

      - name: 🔄 Revert Git commit(s)
        id: git_rollback
        run: |
          COMMIT_SHA="${{ github.event.inputs.commit_to_revert }}"
          CREATE_BRANCH="${{ github.event.inputs.create_rollback_branch }}"

          echo "📋 Analyzing commit to revert..."

          # Verify commit exists
          if ! git cat-file -e "$COMMIT_SHA^{commit}" 2>/dev/null; then
            echo "❌ ERROR: Commit $COMMIT_SHA not found!"
            exit 1
          fi

          # Show commit details
          echo "📝 Commit to revert:"
          git show --stat "$COMMIT_SHA"
          echo ""

          # Option 1: Create rollback branch
          if [ "$CREATE_BRANCH" = "true" ]; then
            ROLLBACK_BRANCH="rollback/revert-${COMMIT_SHA:0:7}-$(date +%Y%m%d-%H%M%S)"

            echo "🔀 Creating rollback branch: $ROLLBACK_BRANCH"
            git checkout -b "$ROLLBACK_BRANCH"

            # Revert the commit
            git revert --no-edit "$COMMIT_SHA" || {
              echo "⚠️  Revert has conflicts, creating revert commit anyway..."
              git revert --continue || true
            }

            # Push rollback branch
            git push origin "$ROLLBACK_BRANCH"

            echo "✅ Rollback branch created: $ROLLBACK_BRANCH"
            echo "rollback_branch=$ROLLBACK_BRANCH" >> $GITHUB_OUTPUT
            echo "rollback_type=branch" >> $GITHUB_OUTPUT

            # Create PR
            gh pr create \
              --title "🔄 Rollback: Revert commit ${COMMIT_SHA:0:7}" \
              --body "## Rollback Information

**Reverted Commit:** \`$COMMIT_SHA\`
**Reason:** ${{ github.event.inputs.reason }}
**Requested by:** @${{ github.actor }}
**Backup Used:** \`${{ github.event.inputs.backup_directory }}\`

## What This PR Does
- Reverts commit $COMMIT_SHA
- Restores Salesforce org from backup
- Maintains audit trail

## Verification
- [ ] Salesforce org restored successfully
- [ ] Git changes verified
- [ ] Tests passing
- [ ] Ready to merge

---
*Automated rollback generated by Complete Rollback workflow*
*Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}*" \
              --base "${{ github.ref_name }}" \
              --head "$ROLLBACK_BRANCH"

          else
            # Option 2: Direct revert on current branch
            echo "🔄 Reverting commit directly on ${{ github.ref_name }} branch..."

            git revert --no-edit "$COMMIT_SHA" || {
              echo "❌ Revert failed due to conflicts!"
              echo "conflict=true" >> $GITHUB_OUTPUT
              exit 1
            }

            # Add rollback metadata to commit message
            git commit --amend -m "Revert: $(git log -1 --format=%s $COMMIT_SHA)

Reason: ${{ github.event.inputs.reason }}
Reverted Commit: $COMMIT_SHA
Requested by: ${{ github.actor }}
Backup: ${{ github.event.inputs.backup_directory }}
Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

            # Push the revert
            git push origin "${{ github.ref_name }}"

            echo "✅ Commit reverted on ${{ github.ref_name }}"
            echo "rollback_type=direct" >> $GITHUB_OUTPUT
          fi

          # Save revert commit SHA
          REVERT_SHA=$(git rev-parse HEAD)
          echo "revert_commit=$REVERT_SHA" >> $GITHUB_OUTPUT
          echo "📝 Revert commit SHA: $REVERT_SHA"

      # ============================================
      # STEP 2: SALESFORCE ROLLBACK
      # ============================================

      - name: Install Salesforce CLI
        run: npm install @salesforce/cli --global

      - name: Authenticate to Salesforce
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt \
            --username ${{ secrets.DEPLOYMENT_USER_NAME }} \
            --jwt-key-file server.key \
            --client-id ${{ secrets.CONSUMER_KEY }} \
            --instance-url ${{ vars.INSTANCE_URL }} \
            --alias ${{ github.event.inputs.target_org }}

      - name: 🔍 Verify backup exists
        run: |
          if [ ! -d "${{ github.event.inputs.backup_directory }}" ]; then
            echo "❌ ERROR: Backup directory not found!"
            echo "📂 Looking for: ${{ github.event.inputs.backup_directory }}"
            echo ""
            echo "📋 Available backups:"
            if [ -d "backups" ]; then
              ls -lht backups/ | head -10
            else
              echo "No backups directory found"
            fi
            exit 1
          fi

          echo "✅ Backup found!"
          echo "📋 Backup contents:"
          find "${{ github.event.inputs.backup_directory }}" -type f | head -20

      - name: 🔄 Restore Salesforce org from backup
        id: sf_restore
        run: |
          echo "🚀 Starting Salesforce org restoration..."

          TEST_LEVEL="NoTestRun"
          if [ "${{ github.event.inputs.skip_tests }}" = "false" ]; then
            TEST_LEVEL="RunLocalTests"
          fi

          sf project deploy start \
            --target-org ${{ github.event.inputs.target_org }} \
            --source-dir "${{ github.event.inputs.backup_directory }}" \
            --test-level $TEST_LEVEL \
            --json > rollback-result.json

          cat rollback-result.json

          # Extract deployment ID
          DEPLOY_ID=$(jq -r '.result.id // "Unknown"' rollback-result.json)
          echo "deployment_id=$DEPLOY_ID" >> $GITHUB_OUTPUT

          # Check status
          STATUS=$(jq -r '.status' rollback-result.json)
          if [ "$STATUS" != "0" ]; then
            echo "❌ Salesforce restoration failed!"
            exit 1
          fi

          echo "✅ Salesforce org restored successfully!"

      # ============================================
      # STEP 3: VERIFICATION & AUDIT
      # ============================================

      - name: ✅ Verify complete rollback
        run: |
          echo "==========================================="
          echo "✅ ROLLBACK COMPLETED SUCCESSFULLY!"
          echo "==========================================="
          echo ""
          echo "📊 Git Rollback:"
          echo "   • Type: ${{ steps.git_rollback.outputs.rollback_type }}"
          echo "   • Revert Commit: ${{ steps.git_rollback.outputs.revert_commit }}"
          if [ "${{ steps.git_rollback.outputs.rollback_type }}" = "branch" ]; then
            echo "   • Branch: ${{ steps.git_rollback.outputs.rollback_branch }}"
          fi
          echo ""
          echo "📊 Salesforce Rollback:"
          echo "   • Deployment ID: ${{ steps.sf_restore.outputs.deployment_id }}"
          echo "   • Target Org: ${{ github.event.inputs.target_org }}"
          echo ""

          jq -r '.result | "   • Components Restored: \(.numberComponentsDeployed // 0)"' rollback-result.json
          jq -r '.result | "   • Status: \(.status // "Unknown")"' rollback-result.json
          echo "==========================================="

      - name: 📝 Create comprehensive audit log
        run: |
          AUDIT_DIR="rollbacks"
          AUDIT_FILE="$AUDIT_DIR/complete-rollback-$(date +%Y%m%d-%H%M%S).log"
          mkdir -p "$AUDIT_DIR"

          cat > "$AUDIT_FILE" << 'AUDIT_EOF'
=====================================
COMPLETE ROLLBACK AUDIT LOG
=====================================
Date: $(date)
Performer: ${{ github.actor }}
Reason: ${{ github.event.inputs.reason }}

GIT ROLLBACK:
- Reverted Commit: ${{ github.event.inputs.commit_to_revert }}
- Revert Commit: ${{ steps.git_rollback.outputs.revert_commit }}
- Rollback Type: ${{ steps.git_rollback.outputs.rollback_type }}
- Branch: ${{ steps.git_rollback.outputs.rollback_branch || github.ref_name }}

SALESFORCE ROLLBACK:
- Target Org: ${{ github.event.inputs.target_org }}
- Backup Used: ${{ github.event.inputs.backup_directory }}
- Deployment ID: ${{ steps.sf_restore.outputs.deployment_id }}
- Tests Skipped: ${{ github.event.inputs.skip_tests }}

WORKFLOW:
- Run ID: ${{ github.run_id }}
- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

SALESFORCE DEPLOYMENT RESULT:
AUDIT_EOF

          jq '.' rollback-result.json >> "$AUDIT_FILE"

          echo "" >> "$AUDIT_FILE"
          echo "=====================================" >> "$AUDIT_FILE"

          echo "📝 Audit log created: $AUDIT_FILE"

          # Commit audit log
          git add "$AUDIT_FILE"
          git commit -m "Add complete rollback audit log - $(date +%Y-%m-%d)"
          git push origin "${{ github.ref_name }}"

      - name: 📢 Summary comment
        if: steps.git_rollback.outputs.rollback_type == 'branch'
        uses: actions/github-script@v6
        with:
          script: |
            const prNumber = context.payload.pull_request?.number;
            if (prNumber) {
              github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ✅ Complete Rollback Successful

**Git:**
- Reverted commit: \`${{ github.event.inputs.commit_to_revert }}\`
- Revert commit: \`${{ steps.git_rollback.outputs.revert_commit }}\`

**Salesforce:**
- Deployment ID: \`${{ steps.sf_restore.outputs.deployment_id }}\`
- Components restored from backup

**Audit:**
- Log saved to repository
- Workflow run: [View Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

Both Git and Salesforce org have been rolled back. Ready for review and merge.`
              });
            }

      - name: 🧹 Cleanup
        if: always()
        run: |
          rm -f server.key
          rm -f rollback-result.json
