name: Deploy to dev environment on push to main
on:
  push:
    branches: [ test ]
    paths:
      - 'force-app/**'

env:
  DELTA_DIR: changed-sources
  COVERAGE_THRESHOLD: 85
  TARGET_ORG_ALIAS: targetOrg

jobs:
  Deploy-to-dev-environment:
      runs-on: ubuntu-latest
      environment: dev
      steps:
          - uses: actions/setup-node@v3
            with:
              node-version: '18'
          - name: 'Checkout source code'
            uses: actions/checkout@v3
            with:
              fetch-depth: '2'
                
          # Now Install Salesforce CLI
          - name: 'Install sfdx'
            run: npm install @salesforce/cli --global
          - name: 'Installing sfdx git delta'
            run: | 
                echo Y | sfdx plugins:install sfdx-git-delta
                sfdx plugins
          - name: 'Create delta packages'
            run: |
                mkdir changed-sources

                # Show git changes for debugging
                echo "[DEBUG] Git diff between HEAD~1 and HEAD:"
                git diff --name-only HEAD~1 HEAD
                echo ""
                echo "[DEBUG] Deleted files (destructive changes):"
                git diff --name-only --diff-filter=D HEAD~1 HEAD
                echo ""

                # Run delta generation with destructive changes support
                echo "🔄 Generating delta packages with destructive changes support..."
                sf sgd source delta --to "HEAD" --from "HEAD~1" --output-dir changed-sources/ --generate-delta --source-dir force-app/
                echo "[INFO] Delta generation completed"

                # Show what was created
                echo ""
                echo "[DEBUG] Contents of changed-sources directory:"
                find changed-sources/ -type f -name "*.xml" 2>/dev/null | head -20

                # Check for package.xml and destructive changes
                if [ -f "changed-sources/package/package.xml" ]; then
                  echo ""
                  echo "✅ [ADDITIVE CHANGES] package.xml found:"
                  cat changed-sources/package/package.xml | head -20
                  echo "..."
                else
                  echo ""
                  echo "📋 [INFO] No additive package.xml was created"
                fi

                if [ -f "changed-sources/destructiveChanges/destructiveChanges.xml" ]; then
                  echo ""
                  echo "🚨 [DESTRUCTIVE CHANGES] destructiveChanges.xml found:"
                  cat changed-sources/destructiveChanges/destructiveChanges.xml
                  echo ""
                  echo "⚠️  CAUTION: This deployment includes component deletions!"
                else
                  echo ""
                  echo "✅ [INFO] No destructive changes detected"
                fi

                # Check for pre/post destructive changes
                if [ -f "changed-sources/destructiveChanges/destructiveChangesPost.xml" ]; then
                  echo ""
                  echo "🚨 [POST-DESTRUCTIVE] destructiveChangesPost.xml found:"
                  cat changed-sources/destructiveChanges/destructiveChangesPost.xml
                else
                  echo "📋 [INFO] No post-destructive changes detected"
                fi

                if [ -f "changed-sources/destructiveChanges/destructiveChangesPre.xml" ]; then
                  echo ""
                  echo "🚨 [PRE-DESTRUCTIVE] destructiveChangesPre.xml found:"
                  cat changed-sources/destructiveChanges/destructiveChangesPre.xml
                else
                  echo "📋 [INFO] No pre-destructive changes detected"
                fi

          - name: 'Process profile changes (Flosum-style selective deployment)'
            run: |
                echo "🎯 Processing profile changes with selective deployment..."

                # Make the profile delta handler executable
                chmod +x scripts/ci/profile_delta_handler.sh

                # Run profile delta processing
                scripts/ci/profile_delta_handler.sh "${{ env.DELTA_DIR }}" "HEAD~1" "HEAD"

                # Check if we have profile changes to process
                if [ -f "${{ env.DELTA_DIR }}/profile-deltas/has_profile_changes.flag" ]; then
                  HAS_PROFILE_CHANGES=$(cat "${{ env.DELTA_DIR }}/profile-deltas/has_profile_changes.flag")

                  if [ "$HAS_PROFILE_CHANGES" = "true" ]; then
                    echo ""
                    echo "📊 Profile Delta Summary:"
                    echo "   • Profile changes detected and processed"
                    echo "   • Selective deployment packages created"
                    echo "   • Delta packages in: ${{ env.DELTA_DIR }}/profile-deltas/"

                    # Show profile delta packages
                    echo ""
                    echo "📦 Profile Delta Packages:"
                    find "${{ env.DELTA_DIR }}/profile-deltas" -name "*.xml" -type f | head -10 | sed 's/^/   • /'

                    # Set flag for later deployment steps
                    echo "true" > "${{ env.DELTA_DIR }}/has_profile_deltas.flag"
                  else
                    echo "✅ No profile changes detected"
                    echo "false" > "${{ env.DELTA_DIR }}/has_profile_deltas.flag"
                  fi
                else
                  echo "✅ No profile processing needed"
                  echo "false" > "${{ env.DELTA_DIR }}/has_profile_deltas.flag"
                fi

          - name: 'Validate profile changes (Enhanced Flosum-style validation)'
            run: |
                echo "🔍 Running enhanced profile validation..."

                # Make the profile validation script executable
                chmod +x scripts/ci/profile_validation.sh

                # Run enhanced profile validation
                scripts/ci/profile_validation.sh "${{ env.DELTA_DIR }}" "${{ env.TARGET_ORG_ALIAS }}"

          - name: 'Pre-destructive changes validation'
            run: |
                # Make the script executable and run pre-destructive validation
                chmod +x scripts/ci/pre_destructive_validation.sh
                scripts/ci/pre_destructive_validation.sh "${{ env.DELTA_DIR }}"

          - name: 'Authenticate with Salesforce'
            run: |
                echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
                sf org login jwt --username ${{ secrets.DEPLOYMENT_USER_NAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default --alias ${{ env.TARGET_ORG_ALIAS }}

          - name: 'Deploy selective profile changes (Flosum-style)'
            run: |
                # Check if we have profile deltas to deploy
                PROFILE_DEPLOYMENT_SUCCESS=true
                if [ -f "${{ env.DELTA_DIR }}/has_profile_deltas.flag" ]; then
                  HAS_PROFILE_DELTAS=$(cat "${{ env.DELTA_DIR }}/has_profile_deltas.flag")

                  if [ "$HAS_PROFILE_DELTAS" = "true" ]; then
                    echo "🎯 Deploying selective profile changes..."
                    echo "   📦 Profile deployment follows Flosum-style delta approach"
                    echo "   🚀 Deploying only changed profile elements"
                    echo ""

                    # Deploy each profile delta package
                    PROFILE_DEPLOYMENT_COUNT=0
                    for profile_dir in "${{ env.DELTA_DIR }}/profile-deltas"/*; do
                      if [ -d "$profile_dir" ] && [ "$(basename "$profile_dir")" != "profile-deltas" ]; then
                        PROFILE_NAME=$(basename "$profile_dir")

                        # Skip if this is just a flag file
                        if [ "$PROFILE_NAME" = "has_profile_changes.flag" ]; then
                          continue
                        fi

                        echo "📋 Deploying profile: $PROFILE_NAME"

                        # Find the profile file (delta or full)
                        PROFILE_FILE=""
                        if [ -f "$profile_dir/${PROFILE_NAME}-delta.profile-meta.xml" ]; then
                          PROFILE_FILE="${PROFILE_NAME}-delta.profile-meta.xml"
                          echo "   📊 Type: Selective delta deployment"

                          # Show what's in the delta
                          FIELD_COUNT=$(grep -c "<fieldPermissions>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          OBJECT_COUNT=$(grep -c "<objectPermissions>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          APEX_COUNT=$(grep -c "<classAccesses>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          USER_PERM_COUNT=$(grep -c "<userPermissions>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          APP_VIS_COUNT=$(grep -c "<applicationVisibilities>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          TAB_VIS_COUNT=$(grep -c "<tabVisibilities>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          RECORD_TYPE_COUNT=$(grep -c "<recordTypeVisibilities>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          PAGE_ACCESS_COUNT=$(grep -c "<pageAccesses>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          FLOW_ACCESS_COUNT=$(grep -c "<flowAccesses>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          CUSTOM_SETTING_COUNT=$(grep -c "<customSettingAccesses>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          LOGIN_HOURS_COUNT=$(grep -c "<loginHours>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          LOGIN_IP_COUNT=$(grep -c "<loginIpRanges>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          SESSION_TIMEOUT_COUNT=$(grep -c "<sessionTimeout>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)
                          EXT_DATA_SOURCE_COUNT=$(grep -c "<externalDataSourceAccesses>" "$profile_dir/$PROFILE_FILE" 2>/dev/null || echo 0)

                          echo "   📈 Permission Changes:"
                          echo "      • Field permissions: $FIELD_COUNT"
                          echo "      • Object permissions: $OBJECT_COUNT"
                          echo "      • Apex class access: $APEX_COUNT"
                          echo "      • User permissions: $USER_PERM_COUNT"
                          echo "      • App visibilities: $APP_VIS_COUNT"
                          echo "      • Tab visibilities: $TAB_VIS_COUNT"
                          echo "      • Record type visibilities: $RECORD_TYPE_COUNT"
                          echo "      • Visualforce page access: $PAGE_ACCESS_COUNT"
                          echo "      • Flow access: $FLOW_ACCESS_COUNT"
                          echo "      • Custom setting access: $CUSTOM_SETTING_COUNT"
                          echo "      • Login hours: $LOGIN_HOURS_COUNT"
                          echo "      • Login IP ranges: $LOGIN_IP_COUNT"
                          echo "      • Session timeout: $SESSION_TIMEOUT_COUNT"
                          echo "      • External data source access: $EXT_DATA_SOURCE_COUNT"

                          # Calculate total changes
                          TOTAL_CHANGES=$((FIELD_COUNT + OBJECT_COUNT + APEX_COUNT + USER_PERM_COUNT + APP_VIS_COUNT + TAB_VIS_COUNT + RECORD_TYPE_COUNT + PAGE_ACCESS_COUNT + FLOW_ACCESS_COUNT + CUSTOM_SETTING_COUNT + LOGIN_HOURS_COUNT + LOGIN_IP_COUNT + SESSION_TIMEOUT_COUNT + EXT_DATA_SOURCE_COUNT))
                          echo "   🎯 Total elements changed: $TOTAL_CHANGES"
                        elif [ -f "$profile_dir/${PROFILE_NAME}.profile-meta.xml" ]; then
                          PROFILE_FILE="${PROFILE_NAME}.profile-meta.xml"
                          echo "   📦 Type: Full profile deployment (new profile)"
                        else
                          echo "   ❌ No profile file found in $profile_dir"
                          PROFILE_DEPLOYMENT_SUCCESS=false
                          continue
                        fi

                        # Deploy this profile using its package.xml
                        echo "   🚀 Deploying $PROFILE_FILE..."

                        set +e  # Don't exit on error immediately
                        PROFILE_DEPLOY_RESULT=$(sf project deploy start \
                          --target-org "${{ env.TARGET_ORG_ALIAS }}" \
                          --manifest "$profile_dir/package.xml" \
                          --source-dir "$profile_dir" \
                          --test-level NoTestRun \
                          --json 2>&1)
                        PROFILE_DEPLOY_EXIT_CODE=$?
                        set -e  # Re-enable exit on error

                        if [ $PROFILE_DEPLOY_EXIT_CODE -eq 0 ]; then
                          # Extract deployment ID
                          PROFILE_DEPLOY_ID=$(echo "$PROFILE_DEPLOY_RESULT" | jq -r '.result.id // "Unknown"' 2>/dev/null || echo "Unknown")
                          echo "   ✅ Profile $PROFILE_NAME deployed successfully"
                          echo "   📋 Deployment ID: $PROFILE_DEPLOY_ID"
                          PROFILE_DEPLOYMENT_COUNT=$((PROFILE_DEPLOYMENT_COUNT + 1))
                        else
                          echo "   ❌ Profile $PROFILE_NAME deployment failed!"
                          echo "   📋 Error details:"
                          echo "$PROFILE_DEPLOY_RESULT" | head -20
                          PROFILE_DEPLOYMENT_SUCCESS=false
                        fi
                        echo ""
                      fi
                    done

                    if [ "$PROFILE_DEPLOYMENT_SUCCESS" = true ] && [ "$PROFILE_DEPLOYMENT_COUNT" -gt 0 ]; then
                      echo "🎉 Selective profile deployment completed successfully!"
                      echo "   📊 Profiles deployed: $PROFILE_DEPLOYMENT_COUNT"
                      echo "   🎯 Deployment method: Flosum-style selective deployment"
                      echo "   ⚡ Only changed elements were deployed (faster & safer)"
                    elif [ "$PROFILE_DEPLOYMENT_COUNT" -eq 0 ]; then
                      echo "⚠️  No profile packages found to deploy"
                    else
                      echo "❌ Some profile deployments failed!"
                      echo "   🔧 Please review the errors above and fix profile issues"
                      echo "   📋 This may block subsequent deployments if other metadata depends on these profiles"
                      # Don't exit here - let the main deployment handle the overall flow
                    fi
                  else
                    echo "📋 No selective profile changes to deploy"
                  fi
                else
                  echo "📋 No profile deployment flags found - skipping selective profile deployment"
                fi

          - name: 'Deploy to environment with destructive changes'
            run: |
                # Check for both additive and destructive changes
                HAS_ADDITIVE=false
                HAS_DESTRUCTIVE=false
                HAS_PRE_DESTRUCTIVE=false
                HAS_POST_DESTRUCTIVE=false

                if [ -f "${{ env.DELTA_DIR }}/package/package.xml" ]; then
                  HAS_ADDITIVE=true
                  echo "✅ Additive changes detected"
                fi

                if [ -f "${{ env.DELTA_DIR }}/destructiveChanges/destructiveChanges.xml" ]; then
                  HAS_DESTRUCTIVE=true
                  echo "🚨 Main destructive changes detected"
                fi

                if [ -f "${{ env.DELTA_DIR }}/destructiveChanges/destructiveChangesPre.xml" ]; then
                  HAS_PRE_DESTRUCTIVE=true
                  echo "🚨 Pre-destructive changes detected"
                fi

                if [ -f "${{ env.DELTA_DIR }}/destructiveChanges/destructiveChangesPost.xml" ]; then
                  HAS_POST_DESTRUCTIVE=true
                  echo "🚨 Post-destructive changes detected"
                fi

                # Show what we detected
                echo "📊 Deployment Analysis:"
                echo "   • Additive changes: $HAS_ADDITIVE"
                echo "   • Destructive changes: $HAS_DESTRUCTIVE"
                echo "   • Pre-destructive changes: $HAS_PRE_DESTRUCTIVE"
                echo "   • Post-destructive changes: $HAS_POST_DESTRUCTIVE"

                # Show profile handling status
                if [ -f "${{ env.DELTA_DIR }}/has_profile_deltas.flag" ]; then
                  HAS_PROFILE_DELTAS=$(cat "${{ env.DELTA_DIR }}/has_profile_deltas.flag")
                  if [ "$HAS_PROFILE_DELTAS" = "true" ]; then
                    echo "   🎯 Profile changes: Deployed separately using selective deployment"
                  else
                    echo "   📋 Profile changes: None detected"
                  fi
                else
                  echo "   📋 Profile changes: None detected"
                fi

                echo ""
                echo "💡 Note: Profile changes are now handled with Flosum-style selective deployment"
                echo "   • Only changed profile elements are deployed (faster & safer)"
                echo "   • Profiles deployed before other metadata to resolve dependencies"
                echo "   • Main deployment below excludes profiles (already processed above)"

                if [ "$HAS_ADDITIVE" = false ] && [ "$HAS_DESTRUCTIVE" = false ] && [ "$HAS_PRE_DESTRUCTIVE" = false ] && [ "$HAS_POST_DESTRUCTIVE" = false ]; then
                  echo "📋 No changes detected for deployment"
                  exit 0
                fi

                echo ""
                echo "🚀 Deploying changes to ${{ env.TARGET_ORG_ALIAS }}..."

                # Determine deployment strategy based on change types
                DEPLOY_CMD_BASE="sf project deploy start --target-org ${{ env.TARGET_ORG_ALIAS }} --json"

                # Check if we need coverage validation (only for Apex/Trigger additive changes)
                NEEDS_COVERAGE_VALIDATION=false
                TEST_CLASSES_TO_RUN=""

                if [ "$HAS_ADDITIVE" = true ]; then
                  echo "📦 Processing additive changes..."

                  # When we have destructive changes, we need to use manifest-based deployment
                  if [ "$HAS_DESTRUCTIVE" = true ] || [ "$HAS_PRE_DESTRUCTIVE" = true ] || [ "$HAS_POST_DESTRUCTIVE" = true ]; then
                    echo "🔄 Using manifest-based deployment (required for destructive changes)"
                    DEPLOY_CMD="$DEPLOY_CMD_BASE --manifest changed-sources/package/package.xml"
                  else
                    echo "🔄 Using source-based deployment (no destructive changes)"
                    DEPLOY_CMD="$DEPLOY_CMD_BASE --source-dir changed-sources/force-app"
                  fi

                  # Only check coverage for Apex classes and triggers in additive changes
                  APEX_FILES=$(find changed-sources/force-app -name "*.cls" -not -name "*Test.cls" 2>/dev/null | wc -l)
                  TRIGGER_FILES=$(find changed-sources/force-app -name "*.trigger" 2>/dev/null | wc -l)
                  TEST_FILES=$(find changed-sources/force-app -name "*Test.cls" 2>/dev/null | wc -l)

                  if [ "$APEX_FILES" -gt 0 ] || [ "$TRIGGER_FILES" -gt 0 ] || [ "$TEST_FILES" -gt 0 ]; then
                    echo "📋 Found Apex/Trigger classes - coverage validation required"
                    NEEDS_COVERAGE_VALIDATION=true

                    # Find test classes for changed regular Apex classes
                    for apex_file in $(find changed-sources/force-app -name "*.cls" -not -name "*Test.cls" 2>/dev/null || true); do
                      CLASS_NAME=$(basename "$apex_file" .cls)
                      echo "   🔍 Regular class: $CLASS_NAME"

                      for pattern in "${CLASS_NAME}Test" "Test${CLASS_NAME}"; do
                        TEST_FILE="changed-sources/force-app/main/default/classes/${pattern}.cls"
                        if [ -f "$TEST_FILE" ]; then
                          echo "   ✅ Found test class: $pattern"
                          if [ -z "$TEST_CLASSES_TO_RUN" ]; then
                            TEST_CLASSES_TO_RUN="$pattern"
                          else
                            TEST_CLASSES_TO_RUN="$TEST_CLASSES_TO_RUN,$pattern"
                          fi
                          break
                        fi
                      done
                    done

                    # Process test classes directly
                    for test_file in $(find changed-sources/force-app -name "*Test.cls" 2>/dev/null || true); do
                      TEST_CLASS_NAME=$(basename "$test_file" .cls)
                      echo "   🧪 Test class: $TEST_CLASS_NAME"

                      if [[ ",$TEST_CLASSES_TO_RUN," != *",$TEST_CLASS_NAME,"* ]]; then
                        if [ -z "$TEST_CLASSES_TO_RUN" ]; then
                          TEST_CLASSES_TO_RUN="$TEST_CLASS_NAME"
                        else
                          TEST_CLASSES_TO_RUN="$TEST_CLASSES_TO_RUN,$TEST_CLASS_NAME"
                        fi
                      fi
                    done

                    # Add test execution to deployment command
                    if [ -n "$TEST_CLASSES_TO_RUN" ]; then
                      echo "🧪 Running specific test classes: $TEST_CLASSES_TO_RUN"
                      DEPLOY_CMD="$DEPLOY_CMD --test-level RunSpecifiedTests --tests $TEST_CLASSES_TO_RUN"
                    else
                      echo "⚠️  No test classes found - using RunLocalTests"
                      DEPLOY_CMD="$DEPLOY_CMD --test-level RunLocalTests"
                    fi
                  else
                    echo "📋 No Apex/Trigger classes - deploying without coverage validation"
                    DEPLOY_CMD="$DEPLOY_CMD --test-level NoTestRun"
                  fi
                fi

                # Handle destructive-only deployments
                if [ "$HAS_ADDITIVE" = false ] && [ "$HAS_DESTRUCTIVE" = true ]; then
                  echo "🗑️  Deploying standalone destructive changes (no coverage validation needed)"
                  DEPLOY_CMD="$DEPLOY_CMD_BASE --metadata-dir changed-sources/destructiveChanges --test-level NoTestRun"
                fi

                # Add destructive changes parameters to additive deployments
                if [ "$HAS_ADDITIVE" = true ]; then
                  if [ "$HAS_PRE_DESTRUCTIVE" = true ]; then
                    echo "🚨 Adding pre-destructive changes to deployment"
                    DEPLOY_CMD="$DEPLOY_CMD --pre-destructive-changes changed-sources/destructiveChanges/destructiveChangesPre.xml"
                  fi

                  if [ "$HAS_POST_DESTRUCTIVE" = true ]; then
                    echo "🚨 Adding post-destructive changes to deployment"
                    DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes changed-sources/destructiveChanges/destructiveChangesPost.xml"
                  fi

                  # Handle main destructive changes as post-destructive if no explicit post file
                  if [ "$HAS_DESTRUCTIVE" = true ] && [ "$HAS_POST_DESTRUCTIVE" = false ]; then
                    echo "🚨 Adding main destructive changes as post-destructive"
                    DEPLOY_CMD="$DEPLOY_CMD --post-destructive-changes changed-sources/destructiveChanges/destructiveChanges.xml"
                  fi
                fi

                echo ""
                echo "[DEBUG] Final deployment command:"
                echo "$DEPLOY_CMD"
                echo ""

                # Execute deployment with detailed error capture
                echo "🚀 Executing deployment..."
                set +e  # Don't exit on error immediately
                DEPLOY_RESULT=$(eval "$DEPLOY_CMD" 2>&1)
                DEPLOY_EXIT_CODE=$?
                set -e  # Re-enable exit on error

                echo "📊 Deployment completed with exit code: $DEPLOY_EXIT_CODE"

                # Always show the deployment result for debugging
                echo ""
                echo "[DEBUG] === FULL DEPLOYMENT RESULT ==="
                echo "$DEPLOY_RESULT"
                echo "[DEBUG] === END DEPLOYMENT RESULT ==="
                echo ""

                if [ $DEPLOY_EXIT_CODE -eq 0 ]; then
                  # Extract and display deployment ID
                  DEPLOY_ID=$(echo "$DEPLOY_RESULT" | jq -r '.result.id // "Unknown"')
                  echo "✅ Deployment completed successfully!"
                  echo "📋 Deployment ID: $DEPLOY_ID"
                  echo ""

                  # Show deployment summary
                  echo "📊 Deployment Summary:"
                  echo "$DEPLOY_RESULT" | jq -r '.result | "   • Components: \(.numberComponentsTotal // "0") total, \(.numberComponentsDeployed // "0") deployed"'
                  echo "$DEPLOY_RESULT" | jq -r '.result | "   • Status: \(.status // "Unknown")"'
                  echo "$DEPLOY_RESULT" | jq -r '.result | "   • Start Time: \(.startDate // "Unknown")"'

                  # Show test results if tests were run (only for Apex/Trigger deployments)
                  if [ "$NEEDS_COVERAGE_VALIDATION" = true ]; then
                    TEST_RESULTS=$(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult // empty')
                    if [ -n "$TEST_RESULTS" ] && [ "$TEST_RESULTS" != "null" ]; then
                      echo ""
                      echo "🧪 Test Results:"
                      echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult | "   • Tests Run: \(.numTestsRun // "0")"'
                      echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult | "   • Failures: \(.numFailures // "0")"'

                      # Extract testRunCoverage for validation
                      TEST_RUN_COVERAGE=$(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult.coverage.summary.testRunCoverage // .result.details.runTestResult.testRunCoverage // .result.details.runTestResult.totalCoverage // empty' 2>/dev/null || echo "")

                      if [ -n "$TEST_RUN_COVERAGE" ] && [ "$TEST_RUN_COVERAGE" != "null" ]; then
                        echo "   • Test Run Coverage: ${TEST_RUN_COVERAGE}%"

                        # Also show individual class coverage for deployed classes if available
                        echo "   📋 Individual Class Coverage:"
                        echo "$DEPLOY_RESULT" | jq -r '
                          .result.details.runTestResult.coverage.coverage[]? // empty |
                          select(.name != null) |
                          "      • \(.name): \(.coveredPercent // "N/A")%"
                        ' 2>/dev/null || echo "      (Individual coverage data not available)"

                        # Validate testRunCoverage meets 85% threshold
                        COVERAGE_INT=$(echo "$TEST_RUN_COVERAGE" | cut -d. -f1)
                        if [ "$COVERAGE_INT" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
                          echo ""
                          echo "❌ DEPLOYMENT FAILED - INSUFFICIENT TEST COVERAGE!"
                          echo "   Test run coverage (${TEST_RUN_COVERAGE}%) is below the required ${{ env.COVERAGE_THRESHOLD }}% threshold."
                          echo ""
                          echo "🔧 Required Action:"
                          echo "   • Improve test coverage in your test classes"
                          echo "   • Ensure all code paths in your Apex classes are properly tested"
                          echo "   • Test run coverage must be ≥ ${{ env.COVERAGE_THRESHOLD }}%"
                          echo ""
                          echo "💡 Test run coverage represents the overall coverage achieved by the test classes"
                          echo "   that ran for this deployment (${TEST_CLASSES_TO_RUN:-"selected tests"})"
                          exit 1
                        else
                          echo "   ✅ Test run coverage (${TEST_RUN_COVERAGE}%) meets the ${{ env.COVERAGE_THRESHOLD }}% requirement"
                          echo "   📊 This represents coverage achieved by: ${TEST_CLASSES_TO_RUN:-"selected tests"}"
                        fi
                      else
                        echo "   ⚠️  Test run coverage not available in deployment results"

                        # Try to extract and show individual coverage as fallback
                        echo "   📋 Attempting to show individual class coverage:"
                        HAS_COVERAGE_DATA=$(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult.coverage.coverage[]? // empty | select(.name != null) | .name' 2>/dev/null | head -1)

                        if [ -n "$HAS_COVERAGE_DATA" ]; then
                          echo "$DEPLOY_RESULT" | jq -r '
                            .result.details.runTestResult.coverage.coverage[]? // empty |
                            select(.name != null) |
                            "      • \(.name): \(.coveredPercent // "N/A")%"
                          ' 2>/dev/null

                          echo ""
                          echo "⚠️  Using individual class coverage validation as fallback"
                          echo "   Checking that all deployed classes meet ${{ env.COVERAGE_THRESHOLD }}% requirement..."

                          # Validate individual classes meet threshold
                          FAILED_CLASSES=""
                          while IFS= read -r coverage_line; do
                            if [ -n "$coverage_line" ]; then
                              COVERAGE_PERCENT=$(echo "$coverage_line" | grep -o '[0-9]\+%' | sed 's/%//')
                              CLASS_NAME=$(echo "$coverage_line" | sed 's/.*• \([^:]*\):.*/\1/')

                              if [ -n "$COVERAGE_PERCENT" ] && [ "$COVERAGE_PERCENT" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
                                FAILED_CLASSES="${FAILED_CLASSES}\n   • ${CLASS_NAME}: ${COVERAGE_PERCENT}%"
                              fi
                            fi
                          done < <(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult.coverage.coverage[]? // empty | select(.name != null) | "• \(.name): \(.coveredPercent // 0)%"' 2>/dev/null)

                          if [ -n "$FAILED_CLASSES" ]; then
                            echo ""
                            echo "❌ DEPLOYMENT FAILED - INSUFFICIENT CLASS COVERAGE!"
                            echo "   The following classes do not meet the ${{ env.COVERAGE_THRESHOLD }}% threshold:"
                            echo -e "$FAILED_CLASSES"
                            exit 1
                          else
                            echo "   ✅ All deployed classes meet the coverage requirement"
                          fi
                        else
                          echo "      (No coverage data available in deployment results)"
                        fi
                      fi
                    else
                      echo ""
                      echo "🧪 Test Results:"
                      echo "   ⚠️  No test execution data found in deployment results"
                    fi
                  else
                    echo ""
                    echo "🎯 Coverage Validation Skipped:"
                    echo "   📋 No Apex/Trigger classes in deployment"
                    echo "   ✅ Coverage validation not required for this deployment type"
                  fi
                else
                  echo "❌ Deployment failed!"
                  echo "Deployment output:"
                  echo "$DEPLOY_RESULT"
                  exit 1
                fi

          - name: 'Post-destructive changes validation'
            if: always()
            run: |
                # Make the script executable and run post-destructive validation
                chmod +x scripts/ci/post_destructive_validation.sh
                scripts/ci/post_destructive_validation.sh "${{ env.DELTA_DIR }}" "${{ env.TARGET_ORG_ALIAS }}"

          - name: 'Additional coverage validation (if needed)'
            id: additional_coverage_validation
            run: |
                # This step provides additional detailed coverage validation
                # Only runs for deployments with Apex/Trigger classes
                if [ -f "${{ env.DELTA_DIR }}/package/package.xml" ]; then
                  # Check if there are Apex/Trigger classes that need coverage validation
                  APEX_FILES=$(find changed-sources/force-app -name "*.cls" 2>/dev/null | wc -l)
                  TRIGGER_FILES=$(find changed-sources/force-app -name "*.trigger" 2>/dev/null | wc -l)

                  if [ "$APEX_FILES" -gt 0 ] || [ "$TRIGGER_FILES" -gt 0 ]; then
                    echo "📊 Running additional detailed coverage validation for Apex/Trigger classes..."
                    echo "(Tests already ran during deployment - this provides detailed coverage analysis)"

                    # Make the script executable
                    chmod +x scripts/ci/check_changed_apex_coverage.sh

                    # Run detailed coverage validation
                    scripts/ci/check_changed_apex_coverage.sh \
                      "${{ env.DELTA_DIR }}" \
                      "${{ env.TARGET_ORG_ALIAS }}" \
                      "${{ env.COVERAGE_THRESHOLD }}"
                  else
                    echo "✅ No Apex/Trigger classes in deployment"
                    echo "📋 Coverage validation not required for this deployment type"
                    echo "   • Only Apex classes and triggers require test coverage"
                    echo "   • Other metadata types (fields, objects, flows, etc.) do not need coverage"
                  fi
                else
                  echo "📋 No additive changes detected"
                  echo "✅ Destructive-only deployments do not require coverage validation"
                  echo "   • Deletions do not need test coverage"
                  echo "   • Coverage is only required when adding/modifying Apex code"
                fi

          - name: 'Cleanup'
            if: always()
            run: |
                rm -f server.key