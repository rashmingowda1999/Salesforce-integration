name: Deploy to dev environment on push to main
on:
  push:
    branches: [ test ]
    paths:
      - 'force-app/**'

env:
  DELTA_DIR: changed-sources
  COVERAGE_THRESHOLD: 85
  TARGET_ORG_ALIAS: targetOrg

jobs:
  Deploy-to-dev-environment:
      runs-on: ubuntu-latest
      environment: dev
      steps:
          - uses: actions/setup-node@v3
            with:
              node-version: '18'
          - name: 'Checkout source code'
            uses: actions/checkout@v3
            with:
              fetch-depth: '2'
                
          # Now Install Salesforce CLI
          - name: 'Install sfdx'
            run: npm install @salesforce/cli --global
          - name: 'Installing sfdx git delta'
            run: | 
                echo Y | sfdx plugins:install sfdx-git-delta
                sfdx plugins
          - name: 'Create delta packages'
            run: |
                mkdir changed-sources

                # Show git changes for debugging
                echo "[DEBUG] Git diff between HEAD~1 and HEAD:"
                git diff --name-only HEAD~1 HEAD

                # Run delta generation
                sf sgd source delta --to "HEAD" --from "HEAD~1" --output-dir changed-sources/ --generate-delta --source-dir force-app/
                echo "[INFO] Diff generated"

                # Show what was created
                echo "[DEBUG] Contents of changed-sources directory:"
                ls -la changed-sources/

                # Check if package.xml exists and show its content
                if [ -f "changed-sources/package/package.xml" ]; then
                  echo "[DEBUG] package.xml found, content:"
                  cat changed-sources/package/package.xml
                else
                  echo "[DEBUG] No package.xml was created"
                fi

          - name: 'Authenticate with Salesforce'
            run: |
                echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
                sf org login jwt --username ${{ secrets.DEPLOYMENT_USER_NAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default --alias ${{ env.TARGET_ORG_ALIAS }}

          - name: 'Deploy to environment'
            run: |
                # Deploy with running relevant test classes for changed Apex classes
                if [ -f "${{ env.DELTA_DIR }}/package/package.xml" ]; then
                  echo "🚀 Deploying changed components to ${{ env.TARGET_ORG_ALIAS }}..."

                  # Check if there are any Apex classes in the deployment
                  APEX_FILES=$(find changed-sources/force-app -name "*.cls" -not -name "*Test.cls" 2>/dev/null | wc -l)
                  TEST_FILES=$(find changed-sources/force-app -name "*Test.cls" 2>/dev/null | wc -l)

                  if [ "$APEX_FILES" -gt 0 ] || [ "$TEST_FILES" -gt 0 ]; then
                    echo "📋 Found Apex classes in deployment - identifying test classes to run..."

                    # Find test classes for changed regular Apex classes
                    TEST_CLASSES_TO_RUN=""

                    # Process regular Apex classes (non-test)
                    for apex_file in $(find changed-sources/force-app -name "*.cls" -not -name "*Test.cls" 2>/dev/null || true); do
                      # Extract class name from file path
                      CLASS_NAME=$(basename "$apex_file" .cls)
                      echo "   🔍 Regular class: $CLASS_NAME"

                      # Look for corresponding test class patterns
                      for pattern in "${CLASS_NAME}Test" "Test${CLASS_NAME}"; do
                        TEST_FILE="changed-sources/force-app/main/default/classes/${pattern}.cls"
                        if [ -f "$TEST_FILE" ]; then
                          echo "   ✅ Found test class: $pattern"
                          if [ -z "$TEST_CLASSES_TO_RUN" ]; then
                            TEST_CLASSES_TO_RUN="$pattern"
                          else
                            TEST_CLASSES_TO_RUN="$TEST_CLASSES_TO_RUN,$pattern"
                          fi
                          break
                        fi
                      done
                    done

                    # Process test classes directly
                    for test_file in $(find changed-sources/force-app -name "*Test.cls" 2>/dev/null || true); do
                      TEST_CLASS_NAME=$(basename "$test_file" .cls)
                      echo "   🧪 Test class: $TEST_CLASS_NAME"

                      # Add to test classes if not already included
                      if [[ ",$TEST_CLASSES_TO_RUN," != *",$TEST_CLASS_NAME,"* ]]; then
                        if [ -z "$TEST_CLASSES_TO_RUN" ]; then
                          TEST_CLASSES_TO_RUN="$TEST_CLASS_NAME"
                        else
                          TEST_CLASSES_TO_RUN="$TEST_CLASSES_TO_RUN,$TEST_CLASS_NAME"
                        fi
                      fi
                    done

                    # Deploy with specific test classes or all local tests
                    if [ -n "$TEST_CLASSES_TO_RUN" ]; then
                      echo "🧪 Running specific test classes during deployment: $TEST_CLASSES_TO_RUN"
                      DEPLOY_RESULT=$(sf project deploy start --source-dir changed-sources/force-app --test-level RunSpecifiedTests --tests "$TEST_CLASSES_TO_RUN" --target-org ${{ env.TARGET_ORG_ALIAS }} --json)
                    else
                      echo "⚠️  No test classes found for Apex classes - using RunLocalTests"
                      DEPLOY_RESULT=$(sf project deploy start --source-dir changed-sources/force-app --test-level RunLocalTests --target-org ${{ env.TARGET_ORG_ALIAS }} --json)
                    fi
                  else
                    echo "📋 No Apex classes in deployment - deploying without running tests"
                    DEPLOY_RESULT=$(sf project deploy start --source-dir changed-sources/force-app --test-level NoTestRun --target-org ${{ env.TARGET_ORG_ALIAS }} --json)
                  fi

                  DEPLOY_EXIT_CODE=$?

                  if [ $DEPLOY_EXIT_CODE -eq 0 ]; then
                    # Extract and display deployment ID
                    DEPLOY_ID=$(echo "$DEPLOY_RESULT" | jq -r '.result.id // "Unknown"')
                    echo "✅ Deployment completed successfully!"
                    echo "📋 Deployment ID: $DEPLOY_ID"
                    echo ""

                    # Show deployment summary
                    echo "📊 Deployment Summary:"
                    echo "$DEPLOY_RESULT" | jq -r '.result | "   • Components: \(.numberComponentsTotal // "0") total, \(.numberComponentsDeployed // "0") deployed"'
                    echo "$DEPLOY_RESULT" | jq -r '.result | "   • Status: \(.status // "Unknown")"'
                    echo "$DEPLOY_RESULT" | jq -r '.result | "   • Start Time: \(.startDate // "Unknown")"'

                    # Show test results if tests were run
                    TEST_RESULTS=$(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult // empty')
                    if [ -n "$TEST_RESULTS" ] && [ "$TEST_RESULTS" != "null" ]; then
                      echo ""
                      echo "🧪 Test Results:"
                      echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult | "   • Tests Run: \(.numTestsRun // "0")"'
                      echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult | "   • Failures: \(.numFailures // "0")"'

                      # Extract testRunCoverage for validation
                      TEST_RUN_COVERAGE=$(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult.coverage.summary.testRunCoverage // .result.details.runTestResult.testRunCoverage // .result.details.runTestResult.totalCoverage // empty' 2>/dev/null || echo "")

                      if [ -n "$TEST_RUN_COVERAGE" ] && [ "$TEST_RUN_COVERAGE" != "null" ]; then
                        echo "   • Test Run Coverage: ${TEST_RUN_COVERAGE}%"

                        # Also show individual class coverage for deployed classes if available
                        echo "   📋 Individual Class Coverage:"
                        echo "$DEPLOY_RESULT" | jq -r '
                          .result.details.runTestResult.coverage.coverage[]? // empty |
                          select(.name != null) |
                          "      • \(.name): \(.coveredPercent // "N/A")%"
                        ' 2>/dev/null || echo "      (Individual coverage data not available)"

                        # Validate testRunCoverage meets 85% threshold
                        COVERAGE_INT=$(echo "$TEST_RUN_COVERAGE" | cut -d. -f1)
                        if [ "$COVERAGE_INT" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
                          echo ""
                          echo "❌ DEPLOYMENT FAILED - INSUFFICIENT TEST COVERAGE!"
                          echo "   Test run coverage (${TEST_RUN_COVERAGE}%) is below the required ${{ env.COVERAGE_THRESHOLD }}% threshold."
                          echo ""
                          echo "🔧 Required Action:"
                          echo "   • Improve test coverage in your test classes"
                          echo "   • Ensure all code paths in your Apex classes are properly tested"
                          echo "   • Test run coverage must be ≥ ${{ env.COVERAGE_THRESHOLD }}%"
                          echo ""
                          echo "💡 Test run coverage represents the overall coverage achieved by the test classes"
                          echo "   that ran for this deployment (${TEST_CLASSES_TO_RUN:-"selected tests"})"
                          exit 1
                        else
                          echo "   ✅ Test run coverage (${TEST_RUN_COVERAGE}%) meets the ${{ env.COVERAGE_THRESHOLD }}% requirement"
                          echo "   📊 This represents coverage achieved by: ${TEST_CLASSES_TO_RUN:-"selected tests"}"
                        fi
                      else
                        echo "   ⚠️  Test run coverage not available in deployment results"

                        # Try to extract and show individual coverage as fallback
                        echo "   📋 Attempting to show individual class coverage:"
                        HAS_COVERAGE_DATA=$(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult.coverage.coverage[]? // empty | select(.name != null) | .name' 2>/dev/null | head -1)

                        if [ -n "$HAS_COVERAGE_DATA" ]; then
                          echo "$DEPLOY_RESULT" | jq -r '
                            .result.details.runTestResult.coverage.coverage[]? // empty |
                            select(.name != null) |
                            "      • \(.name): \(.coveredPercent // "N/A")%"
                          ' 2>/dev/null

                          echo ""
                          echo "⚠️  Using individual class coverage validation as fallback"
                          echo "   Checking that all deployed classes meet ${{ env.COVERAGE_THRESHOLD }}% requirement..."

                          # Validate individual classes meet threshold
                          FAILED_CLASSES=""
                          while IFS= read -r coverage_line; do
                            if [ -n "$coverage_line" ]; then
                              COVERAGE_PERCENT=$(echo "$coverage_line" | grep -o '[0-9]\+%' | sed 's/%//')
                              CLASS_NAME=$(echo "$coverage_line" | sed 's/.*• \([^:]*\):.*/\1/')

                              if [ -n "$COVERAGE_PERCENT" ] && [ "$COVERAGE_PERCENT" -lt "${{ env.COVERAGE_THRESHOLD }}" ]; then
                                FAILED_CLASSES="${FAILED_CLASSES}\n   • ${CLASS_NAME}: ${COVERAGE_PERCENT}%"
                              fi
                            fi
                          done < <(echo "$DEPLOY_RESULT" | jq -r '.result.details.runTestResult.coverage.coverage[]? // empty | select(.name != null) | "• \(.name): \(.coveredPercent // 0)%"' 2>/dev/null)

                          if [ -n "$FAILED_CLASSES" ]; then
                            echo ""
                            echo "❌ DEPLOYMENT FAILED - INSUFFICIENT CLASS COVERAGE!"
                            echo "   The following classes do not meet the ${{ env.COVERAGE_THRESHOLD }}% threshold:"
                            echo -e "$FAILED_CLASSES"
                            exit 1
                          else
                            echo "   ✅ All deployed classes meet the coverage requirement"
                          fi
                        else
                          echo "      (No coverage data available in deployment results)"
                        fi
                      fi
                    fi
                  else
                    echo "❌ Deployment failed!"
                    echo "Deployment output:"
                    echo "$DEPLOY_RESULT"
                    exit 1
                  fi
                else
                  echo "No package.xml found, skipping deployment"
                fi

          - name: 'Additional coverage validation (if needed)'
            id: additional_coverage_validation
            run: |
                # This step provides additional detailed coverage validation
                # Tests already ran during deployment, but this gives more detailed reporting
                if [ -f "${{ env.DELTA_DIR }}/package/package.xml" ]; then
                  # Check if there are Apex classes that need coverage validation
                  APEX_FILES=$(find changed-sources/force-app -name "*.cls" 2>/dev/null | wc -l)

                  if [ "$APEX_FILES" -gt 0 ]; then
                    echo "📊 Running additional detailed coverage validation for changed classes..."
                    echo "(Tests already ran during deployment - this provides detailed coverage analysis)"

                    # Make the script executable
                    chmod +x scripts/ci/check_changed_apex_coverage.sh

                    # Run detailed coverage validation
                    scripts/ci/check_changed_apex_coverage.sh \
                      "${{ env.DELTA_DIR }}" \
                      "${{ env.TARGET_ORG_ALIAS }}" \
                      "${{ env.COVERAGE_THRESHOLD }}"
                  else
                    echo "📋 No Apex classes in deployment - skipping additional coverage validation"
                  fi
                else
                  echo "No package.xml found, skipping additional coverage validation"
                fi

          - name: 'Cleanup'
            if: always()
            run: |
                rm -f server.key