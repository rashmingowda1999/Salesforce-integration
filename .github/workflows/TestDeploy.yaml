name: Deploy to dev environment on push to main

on:
  push:
    branches: [ main ]
    paths:
      - 'force-app/**'

jobs:
  Deploy-to-dev-environment:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: 'Checkout source code'
        uses: actions/checkout@v3
        with:
          fetch-depth: '2'
                
      # Install Salesforce CLI (once per job)
      - name: 'Install Salesforce CLI'
        run: npm install @salesforce/cli --global
      - name: 'Install sfdx git delta plugin'
        run: | 
            echo Y | sf plugins install sfdx-git-delta
            sf plugins

      # Create delta packages (once per job)
      - name: 'Create delta packages'
        run: | 
            mkdir changed-sources
            sf sgd source delta --to "HEAD" --from "HEAD~1" --output changed-sources/ --generate-delta --source force-app/
            echo "[INFO] Diff generated"

      # Authenticate once and set default (reused across steps)
      - name: 'Authenticate with Salesforce'
        run: |
          echo "${{ secrets.JWT_SERVER_KEY }}" > server.key
          sf org login jwt --username ${{ secrets.DEPLOYMENT_USER_NAME }} --jwt-key-file server.key --client-id ${{ secrets.CONSUMER_KEY }} --instance-url ${{ vars.INSTANCE_URL }} --set-default

      # Pre-Destructive Changes: Validation and Backup (runs only if destructive files exist)
      - name: 'Pre-Destructive Validation and Backup'
        if: hashFiles('changed-sources/destructiveChanges.xml') != '' || hashFiles('changed-sources/destructiveChangesPost.xml') != ''
        run: |
          # Example: Query and backup data related to components being deleted
          sf data query --query "SELECT Id, Name FROM MyCustomObject__c LIMIT 10" --result-format json > pre_deployment_backup.json
          echo "[INFO] Pre-destructive backup created. Check pre_deployment_backup.json for data."
          # Add custom validations, e.g., check for dependencies
          # sf apex run test --tests MyValidationTestClass --result-format human  # Optional: Run specific validation tests

      # Main Deployment: Deploy updates/adds with tests
      - name: 'Deploy to environment with running all local tests'
        run: |
          sf project deploy start --source-dir changed-sources/force-app --test-level RunLocalTests

      # Post-Destructive Changes: Deploy deletions (runs only if file exists and main deploy succeeds)
      - name: 'Deploy post-destructive changes to environment'
        if: success() && (hashFiles('changed-sources/destructiveChanges.xml') != '' || hashFiles('changed-sources/destructiveChangesPost.xml') != '')
        run: |
          if [ -f changed-sources/destructiveChangesPost.xml ]; then
            sf project deploy start --destructive-changes changed-sources/destructiveChangesPost.xml --ignore-errors
          elif [ -f changed-sources/destructiveChanges.xml ]; then
            sf project deploy start --destructive-changes changed-sources/destructiveChanges.xml --ignore-errors
          else
            echo "No destructive changes manifest found. Skipping."
          fi

      # Cleanup (optional, at the end)
      - name: 'Clean up'
        if: always()
        run: rm -f server.key pre_deployment_backup.json