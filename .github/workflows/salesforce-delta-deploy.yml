name: Salesforce Delta Deployment

on:
  push:
    branches: [ github_copilot_* ]
  pull_request:
    branches: [ github_copilot_* ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # For git history

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Salesforce CLI
      run: |
        wget https://developer.salesforce.com/media/salesforce-cli/sfdx-linux-amd64.tar.xz
        mkdir /tmp/sfdx
        tar xJf sfdx-linux-amd64.tar.xz -C /tmp/sfdx --strip-components 1
        /tmp/sfdx/bin/sfdx --version
        /tmp/sfdx/bin/sfdx plugins --core
        echo '$GITHUB_WORKSPACE/bin' >> $GITHUB_PATH
        chmod +x $GITHUB_WORKSPACE/bin/sfdx

    - name: Install dependencies
      run: cd Salesforce-integration && npm install --no-lockfile-check || true
      shell: bash

    - name: Write JWT key
      run: echo \"${{ secrets.JWT_SERVER_KEY }}\" > /tmp/server.key

    - name: Authenticate Org
      env:
        SF_CLIENT_ID: ${{ secrets.CONSUMER_KEY }}
        SF_USERNAME: ${{ secrets.DEPLOYMENT_USER_NAME }}
        SF_INSTANCE_URL: ${{ vars.INSTANCE_URL }}
      run: cd Salesforce-integration && ./scripts/deploy/auth-jwt.sh

    - name: Check Apex Changes & Run Tests
      if: github.event_name == 'push'
      run: |
        cd Salesforce-integration
        if git diff --name-only HEAD~1 | grep -E '\\.cls|\\.trigger'; then
          ./scripts/apex/run-impacted-tests-coverage.sh deployment-org HEAD~1 HEAD
        else
          echo 'No Apex changes - skipping tests'
        fi

    - name: Generate Delta
      run: cd Salesforce-integration && ./scripts/deploy/generate-delta.sh HEAD~1 HEAD

    - name: Profile Delta (if needed)
      run: |
        cd Salesforce-integration
        CHANGED=$(git diff --name-only HEAD~1 HEAD -- force-app | grep -E 'objects|permissionSets|profiles')
        if [ -n \"$CHANGED\" ]; then
          ./scripts/deploy/retrieve-profile-delta.sh HEAD~1 HEAD
          ./scripts/deploy/deploy-delta.sh true  # Dry-run profiles first?
        fi

    - name: Deploy Delta
      if: github.event_name == 'push'
      run: cd Salesforce-integration && ./scripts/deploy/deploy-delta.sh false

    - name: Dry-Run Deploy (PR only)
      if: github.event_name == 'pull_request'
      run: cd Salesforce-integration && ./scripts/deploy/deploy-delta.sh true

    - name: Cleanup
      if: always()
      run: |
        sf org logout --target-org deployment-org || true
        rm -f /tmp/server.key || true

